[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "knowledge-system"
version = "0.1.0.dev0"
description = "团队知识助手核心工程；M0接口验证阶段，业务运行尚未就绪"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-ai-slim[temporal]==2.42.0",
  "temporalio==1.32.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "langcodes==3.5.1",
  "rfc8785==0.1.4",
  "SQLAlchemy==2.0.53",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.5",
]

[dependency-groups]
api = ["fastapi==0.141.1", "uvicorn==0.52.4"]
auth = ["argon2-cffi==25.1.0", "PyJWT[crypto]==2.14.0", "cryptography==50.0.1"]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
quality = ["mypy==1.20.2", "ruff==0.16.7"]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/knowledge_system"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["knowledge_system"]
